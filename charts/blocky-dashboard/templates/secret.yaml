{{- $data := fromYaml (include "blocky-dashboard.secretData" .) }}
{{- if $data }}
{{- if has (include "blocky-dashboard.fullname" .) (include "blocky-dashboard.existingSecrets" . | fromJsonArray) }}
{{- fail (printf "secrets.existingSecret(s) lists %q, the name of the Secret this chart creates for secret values in config; rename that Secret, or move those values into it" (include "blocky-dashboard.fullname" .)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blocky-dashboard.fullname" . }}
  labels:
    {{- include "blocky-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
