{{- $data := fromYaml (include "blocky-dashboard.secretData" .) }}
{{- if and $data (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blocky-dashboard.fullname" . }}
  labels:
    {{- include "blocky-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
