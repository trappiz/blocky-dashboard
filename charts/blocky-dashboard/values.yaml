# Default values for blocky-dashboard.

image:
  # Image repository, e.g. docker.io/<account>/blocky-dashboard. Required.
  # The published chart has it set to the image built by the same release.
  repository: ""
  # Defaults to the chart's appVersion.
  tag: ""
  # Pins the image by digest (sha256:...); takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1
revisionHistoryLimit: 3

# Application configuration, rendered to /etc/blocky-dashboard/config.json.
# Mirrors config.example.json. Secret fields (auth.password,
# auth.headerToken, blocky.token and instances[].token) are moved into a
# Secret and passed as environment variables instead of the ConfigMap.
config:
  ui:
    title: Blocky Dashboard
    # Name of the single instance (when instances is empty).
    instance: blocky
    # Serve the UI below this path, e.g. /blocky. Also used as the Ingress
    # and HTTPRoute path.
    basePath: /
    autoRefreshSeconds: 30

  auth:
    enabled: false
    username: admin
    # Prefer secrets.existingSecret over setting these here.
    password: ""
    headerToken: ""

  # Single Blocky instance, used when instances is empty.
  blocky:
    url: http://blocky.blocky.svc.cluster.local:4000
    token: ""
    headers: {}
  queryLog:
    # Set to false to hide the query log without removing its settings.
    enabled: true
    # Blocky's queryLog.type: csv or csv-client (log files, mount them with
    # queryLogVolumes), mysql, postgresql or timescale (read over the
    # network), or http (a JSON log server next to Blocky, for csv or
    # sqlite logs on another host). Empty disables query search.
    type: ""
    # csv: directory inside the container. Database: the same connection
    # string (DSN) as Blocky's queryLog.target; it is moved into the Secret.
    # Prefer a read-only database user. http: the log server's URL,
    # e.g. http://10.1.1.60:4001/.
    target: ""
    # http only: token the log server requires, sent as a bearer token. It
    # is moved into the chart's Secret; or leave it empty and put it in an
    # existing Secret as BLOCKY_DASHBOARD_QUERYLOG_TOKEN.
    token: ""
    days: 1
    # Database shared by several Blocky servers: SQL LIKE pattern on the
    # hostname of the Blocky that wrote the entry, e.g. blocky-primary-%.
    hostname: ""

  # Several Blocky instances. Each entry: name, url, token, headers, queryLog.
  instances: []
  #  - name: primary
  #    url: http://blocky-primary.blocky.svc:4000
  #    token: ""
  #    queryLog:
  #      type: csv
  #      target: /logs/primary
  #      days: 2
  #  - name: secondary
  #    url: http://blocky-secondary.blocky.svc:4000
  #    queryLog:
  #      type: postgresql
  #      target: postgres://dashboard:password@postgres.blocky.svc:5432/blocky
  #      hostname: blocky-secondary-%

secrets:
  # Use an existing Secret instead of the values above. Its keys are the
  # environment variable names, all optional:
  #   BLOCKY_DASHBOARD_AUTH_PASSWORD
  #   BLOCKY_DASHBOARD_AUTH_HEADER_TOKEN
  #   BLOCKY_DASHBOARD_BLOCKY_TOKEN              (single instance)
  #   BLOCKY_DASHBOARD_QUERYLOG_TARGET           (single instance, database DSN)
  #   BLOCKY_DASHBOARD_QUERYLOG_TOKEN            (single instance, log server token)
  #   BLOCKY_DASHBOARD_INSTANCE_<NAME>_TOKEN     (per instance; name upper-cased,
  #                                               non-alphanumerics → _)
  #   BLOCKY_DASHBOARD_INSTANCE_<NAME>_QUERYLOG_TARGET
  #   BLOCKY_DASHBOARD_INSTANCE_<NAME>_QUERYLOG_TOKEN
  existingSecret: ""
  # Several existing Secrets, e.g. one for the auth password and one for the
  # query log tokens. They are loaded after existingSecret. Secret values set
  # in config (passwords, tokens) still go into the Secret this chart
  # creates, so the two can be mixed, e.g. the password in values and the
  # query log tokens in an existing Secret. When a key is in more than one
  # place, the existing Secret listed last wins.
  existingSecrets: []
  #  - blocky-dashboard-auth
  #  - blocky-dashboard-querylog

# Read-only volumes holding Blocky's csv query logs. Point
# config.queryLog.target / instances[].queryLog.target at mountPath.
queryLogVolumes: []
#  - name: primary-logs
#    mountPath: /logs/primary
#    source:
#      hostPath:
#        path: /var/lib/blocky/logs
#        type: Directory
#  - name: secondary-logs
#    mountPath: /logs/secondary
#    source:
#      persistentVolumeClaim:
#        claimName: blocky-logs
#        readOnly: true
#  - name: nfs-logs
#    mountPath: /logs/nfs
#    source:
#      nfs:
#        server: nas.example.com
#        path: /export/blocky/logs
#        readOnly: true

extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

containerPort: 3001

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  # Defaults to config.ui.basePath.
  path: ""
  pathType: Prefix
  hosts: []
  #  - dashboard.example.com
  tls: []
  #  - secretName: dashboard-tls
  #    hosts: [dashboard.example.com]

# Gateway API HTTPRoute.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
  #  - name: gateway
  #    namespace: gateway-system
  hostnames: []
  # Defaults to config.ui.basePath.
  path: ""

networkPolicy:
  enabled: false
  # Peers allowed to reach the dashboard; empty allows all.
  ingressFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ingress-nginx
  # Restrict egress to DNS plus these rules; Blocky must stay reachable.
  egress:
    enabled: false
    to: []
    #  - namespaceSelector:
    #      matchLabels:
    #        kubernetes.io/metadata.name: blocky
    #    ports:
    #      - port: 4000

podDisruptionBudget:
  enabled: false
  minAvailable: 1

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
priorityClassName: ""
