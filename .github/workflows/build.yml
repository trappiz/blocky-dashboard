name: build

# Builds static binaries for Linux, macOS and Windows (amd64 and arm64) on
# every push to main and every pull request and uploads them as workflow
# artifacts (Actions → run → Artifacts), so any commit can be downloaded and
# tried. Release binaries for version tags are
# built and attached to the GitHub Release by release.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest patch of a supported Go release on every run, so security
          # fixes arrive automatically. Go patches only its two newest
          # releases; move this on when 1.29 ships. go.mod's "go 1.25.0" is
          # only the minimum version.
          go-version: "1.27.x"
          check-latest: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          CGO_ENABLED: "0"
        run: |
          version="dev-${GITHUB_SHA::7}"
          go build -trimpath -ldflags="-s -w -X main.version=$version" -o "blocky-dashboard-${GOOS}-${GOARCH}${EXT}" ./cmd/blocky-dashboard
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blocky-dashboard-${{ matrix.goos }}-${{ matrix.goarch }}
          path: blocky-dashboard-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 14
