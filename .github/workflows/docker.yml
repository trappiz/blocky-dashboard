name: docker

# Builds the container image on every push and pull request, and pushes it to
# Docker Hub for pushes to main (tag "edge") and version tags (v1.2.3 →
# 1.2.3, 1.2, 1, latest).
#
# Configure once under Settings → Secrets and variables → Actions:
#   variable DOCKERHUB_USERNAME  Docker Hub account (or organisation) to push to
#   secret   DOCKERHUB_TOKEN     Docker Hub access token with Read & Write scope
#   variable IMAGE_NAME          optional, full image name; defaults to
#                                <DOCKERHUB_USERNAME>/<this repository's name>

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  PLATFORMS: linux/amd64,linux/arm64
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        env:
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$PUSH" = "true" ] && [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME repository variable (and the DOCKERHUB_TOKEN secret) to push images."
            exit 1
          fi
          name="${IMAGE_NAME:-${DOCKERHUB_USERNAME:-$OWNER}/$REPO_NAME}"
          echo "name=$(echo "$name" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=edge,branch=main
            type=sha,format=short
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ env.PUSH == 'true' }}
