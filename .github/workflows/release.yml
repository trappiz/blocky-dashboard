name: release

# For version tags (v1.2.3) creates the GitHub Release with Linux, macOS and
# Windows binaries (amd64 and arm64), checksums and generated notes that list
# the container images. The images themselves are built by docker.yml, and
# helm.yml attaches the packaged chart to the same release;
# softprops/action-gh-release reuses an existing release for the tag, so the
# workflows can finish in any order.
# Tags with a suffix (v1.2.3-rc.1) are marked as pre-releases.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest patch of a supported Go release on every run, so security
          # fixes arrive automatically. Go patches only its two newest
          # releases; move this on when 1.29 ships. go.mod's "go 1.25.0" is
          # only the minimum version.
          go-version: "1.27.x"
          check-latest: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "blocky-dashboard-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}${EXT}" ./cmd/blocky-dashboard
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blocky-dashboard-${{ matrix.goos }}-${{ matrix.goarch }}
          path: blocky-dashboard-*

  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image names
        id: names
        uses: ./.github/actions/image-names
        with:
          dockerhub-username: ${{ vars.DOCKERHUB_USERNAME }}
          image-name: ${{ vars.IMAGE_NAME }}
          chart-name: ${{ vars.CHART_NAME }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and notes
        env:
          GHCR: ${{ steps.names.outputs.ghcr }}
          DOCKERHUB: ${{ steps.names.outputs.dockerhub }}
          CHART: ${{ steps.names.outputs.chart }}
          CHART_GHCR: ${{ steps.names.outputs.chart-ghcr }}
          CHART_DOCKERHUB: ${{ steps.names.outputs.chart-dockerhub }}
        run: |
          cd dist && sha256sum blocky-dashboard-* > checksums.txt && cd ..
          tag="$GITHUB_REF_NAME"
          # Helm only resolves chart versions without the v prefix.
          chart_version="${GITHUB_REF_NAME#v}"
          {
            echo "## Container image"
            echo
            echo "Multi-arch (linux/amd64, linux/arm64), distroless, non-root."
            echo
            echo '```bash'
            echo "docker pull $GHCR:$tag"
            [ -n "$DOCKERHUB" ] && echo "docker pull $DOCKERHUB:$tag"
            echo '```'
            echo
            echo "## Helm chart"
            echo
            echo '```bash'
            echo "helm install blocky-dashboard $CHART_GHCR/$CHART --version $chart_version -f values.yaml"
            [ -n "$CHART_DOCKERHUB" ] && echo "helm install blocky-dashboard $CHART_DOCKERHUB/$CHART --version $chart_version -f values.yaml"
            echo '```'
            echo
            echo "The packaged chart (\`$CHART-$chart_version.tgz\`) is also attached below."
            echo
            echo "## Binaries"
            echo
            echo "Static binaries for Linux, macOS and Windows (amd64 and arm64) are attached below; verify with \`sha256sum -c checksums.txt\`."
          } > notes.md

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/blocky-dashboard-*
            dist/checksums.txt
